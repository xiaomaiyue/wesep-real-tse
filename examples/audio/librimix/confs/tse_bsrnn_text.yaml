# Text-only TSE: BSRNN conditioned on a frozen-text-encoder embedding.
# The cue modality is the experiment variable; the separator and fusion
# interface are identical to the speaker-cue baseline (tse_bsrnn_spk.yaml).
dataloader_args:
  batch_size: 4   # per-GPU; tuned for 24GB 4090D (15/3s OOMs; mem dominated by seq len)
  drop_last: true
  num_workers: 6
  pin_memory: true
  prefetch_factor: 6

dataset_args:
  resample_rate: &sr 16000
  sample_num_per_epoch: 0
  shuffle: true
  shuffle_args:
    shuffle_size: 2500
  chunk_len: 24000   # 1.5s @16k; 48000(3s) OOMs 24GB 4090D — seq len drives BSRNN mem
  noise_prob: 0
  noise_lmdb_file: './data/musan/lmdb'
  cues:
    audio:
      use: false        # text-only: ignore audio enrollment at training time
      required: false
    text:
      use: true
      required: true
  cue_processing: { }

enable_amp: false
exp_dir: exp/BSRNN_TEXT
gpus: '0,1'
log_batch_interval: 100

loss: SISDR
loss_args: { }

model:
  tse_model: TSE_BSRNN_SPK
model_args:
  tse_model:
    separator:
      sr: *sr
      win: 512
      stride: 128
      feature_dim: 128
      num_repeat: 6
      causal: False
      nspk: 1
    speaker:
      features:
        listen:
          enabled: False
        usef:
          enabled: False
        tfmap:
          enabled: False
        context:
          enabled: False
        spkemb:
          enabled: False
        textemb:
          enabled: True
          text_dim: 384        # MiniLM-L6-v2; switch to 768 for BERT/MPNet
          proj_dim: 192        # = speaker embedding dim (controlled compare)
          proj_hidden: 256
          proj_layers: 2
          fusion: "multiply"   # additive | concat | multiply | FiLM

model_init:
  tse_model: null
  discriminator: null
  spk_model: null

num_avg: 10
num_epochs: 150

optimizer:
  tse_model: Adam
optimizer_args:
  tse_model:
    lr: 0.001
    weight_decay: 0.0001

clip_grad: 5.0
save_epoch_interval: 10

scheduler:
  tse_model: ExponentialDecrease
scheduler_args:
  tse_model:
    final_lr: 2.5e-05
    initial_lr: 0.001
    warm_from_zero: false
    warm_up_epoch: 0

seed: 42
