# Exp1b on 4 GPUs: same stabilized cross-attn recipe as tse_bsrnn_text_xattn_lr
# but for 4-GPU DDP. 4 GPUs doubles the effective batch (8 -> 16 mixtures) and
# halves iters/epoch, so warmup is bumped 3 -> 5 epochs to keep enough warmup
# steps. Everything else identical (lr 3e-4, clip 1.0, batch_size 4/GPU).
dataloader_args:
  batch_size: 4
  drop_last: true
  num_workers: 6
  pin_memory: true
  prefetch_factor: 6

dataset_args:
  resample_rate: &sr 16000
  sample_num_per_epoch: 0
  shuffle: true
  shuffle_args:
    shuffle_size: 2500
  chunk_len: 24000
  noise_prob: 0
  noise_lmdb_file: './data/musan/lmdb'
  cues:
    audio:
      use: false
      required: false
    text:
      use: true
      required: true
  cue_processing: { }

enable_amp: false
exp_dir: exp/BSRNN_TEXT_XATTN_LR4
gpus: '0,1,2,3'
log_batch_interval: 100

loss: SISDR
loss_args: { }

model:
  tse_model: TSE_BSRNN_SPK
model_args:
  tse_model:
    separator:
      sr: *sr
      win: 512
      stride: 128
      feature_dim: 128
      num_repeat: 6
      causal: False
      nspk: 1
    speaker:
      features:
        listen:
          enabled: False
        usef:
          enabled: False
        tfmap:
          enabled: False
        context:
          enabled: False
        spkemb:
          enabled: False
        textemb:
          enabled: True
          mode: cross_attn
          text_dim: 384
          atten_dim: 128
          num_heads: 4
          fusion: "multiply"
          mix_dim: 128

model_init:
  tse_model: null
  discriminator: null
  spk_model: null

num_avg: 10
num_epochs: 60

optimizer:
  tse_model: Adam
optimizer_args:
  tse_model:
    lr: 0.0003
    weight_decay: 0.0001

clip_grad: 1.0
save_epoch_interval: 5

scheduler:
  tse_model: ExponentialDecrease
scheduler_args:
  tse_model:
    final_lr: 1.0e-05
    initial_lr: 0.0003
    warm_from_zero: true
    warm_up_epoch: 5

seed: 42
