# Probe R4: R3 (time-wise FiLM + swap/contrast) + warm-started BSRNN backbone.
# The separator (sep_model.*) is loaded from the official REAL-TSE
# spk_emb_100 checkpoint via partial load; spk_ft.textemb.* stays random.
dataloader_args:
  batch_size: 1
  drop_last: true
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2

dataset_args:
  resample_rate: &sr 16000
  sample_num_per_epoch: 512
  shuffle: true
  shuffle_args:
    shuffle_size: 2500
  chunk_len: 96000
  noise_prob: 0
  noise_lmdb_file: './data/musan/lmdb'
  cues:
    audio:
      use: false
      required: false
    text:
      use: true
      required: true
  cue_processing: { }

enable_amp: true
exp_dir: exp/BSRNN_TEXT_XATTN_FILM_SWAP_CONTRAST_WARMSTART_6S_PROBE_R4
gpus: '0,1,2,3'
log_batch_interval: 20

loss: SISDR
loss_args:
  swap_loss_weight: 1.0
  swap_loss_margin: 0.5
  contrast_loss_weight: 1.0
  contrast_loss_margin: 0.5

model:
  tse_model: TSE_BSRNN_SPK
model_args:
  tse_model:
    separator:
      sr: *sr
      win: 512
      stride: 128
      feature_dim: 128
      num_repeat: 6
      causal: False
      nspk: 1
    speaker:
      features:
        listen:
          enabled: False
        usef:
          enabled: False
        tfmap:
          enabled: False
        context:
          enabled: False
        spkemb:
          enabled: False
        textemb:
          enabled: True
          mode: cross_attn
          text_dim: 384
          atten_dim: 128
          num_heads: 4
          fusion: "timewise_film"
          film_scale: 1.0
          film_init_std: 0.0001
          film_bound: true
          mix_dim: 128

# Warm-start: partial load of sep_model.* from the spk_emb_100 backbone.
# Path is relative to the recipe dir (examples/audio/librimix), which is the
# CWD during training. Place the checkpoint there before launching.
model_init:
  tse_model: pretrained/spk_emb_100/avg_model.pt
  discriminator: null
  spk_model: null

# Stage A: freeze the warm-started BSRNN backbone, train only the text-cue
# path (spk_ft.textemb.* = projection + cross-attn + FiLM). For Stage B,
# remove this block and resume from a Stage-A checkpoint at low LR.
freeze:
  sep_model: true

num_avg: 2
num_epochs: 5

optimizer:
  tse_model: Adam
optimizer_args:
  tse_model:
    lr: 0.00015
    weight_decay: 0.00001

clip_grad: 1.0
save_epoch_interval: 1

scheduler:
  tse_model: ExponentialDecrease
scheduler_args:
  tse_model:
    final_lr: 1.0e-05
    initial_lr: 0.00015
    warm_from_zero: true
    warm_up_epoch: 1

seed: 42
