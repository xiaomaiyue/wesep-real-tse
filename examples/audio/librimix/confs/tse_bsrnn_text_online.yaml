# Online dynamic-mixing variant (B). Train on a pool of single-speaker
# utterances that are randomly paired + remixed at random SNR every epoch
# (effectively unlimited unique mixtures) -> attacks the generalization gap
# that fixed-data training + classical regularization (A) could not close.
# Text cue keyed per-utterance (utt_id); full-size model + normal LR (overfit
# is no longer the constraint with online data).
dataloader_args:
  batch_size: 8   # 4->8: 24GB 4090D has headroom (batch4 used ~11GB); faster
  drop_last: true
  num_workers: 6
  pin_memory: true
  prefetch_factor: 6

dataset_args:
  resample_rate: &sr 16000
  sample_num_per_epoch: 0
  shuffle: true
  shuffle_args:
    shuffle_size: 2500
  chunk_len: 24000
  online_mix: true
  num_speakers:
    distribution: [0.0, 1.0, 0.0]   # P(1spk),P(2spk),P(3+spk) -> always 2
    max_speakers: 2
  online_buffer_size: 2000
  snr_conf:
    range: [-5, 10]            # target-to-interferer ratio (dB)
    gain: [-12, 0]             # random global gain (dB)
  reverb_prob: 0
  noise_prob: 0
  noise_lmdb_file: './data/musan/lmdb'
  cues:
    audio:
      use: false
      required: false
    text:
      use: true
      required: true
  cue_processing: { }

enable_amp: false
exp_dir: exp/BSRNN_TEXT_ONLINE
gpus: '0,1'
log_batch_interval: 100

loss: SISDR
loss_args: { }

model:
  tse_model: TSE_BSRNN_SPK
model_args:
  tse_model:
    separator:
      sr: *sr
      win: 512
      stride: 128
      feature_dim: 128
      num_repeat: 6
      causal: False
      nspk: 1
    speaker:
      features:
        listen:
          enabled: False
        usef:
          enabled: False
        tfmap:
          enabled: False
        context:
          enabled: False
        spkemb:
          enabled: False
        textemb:
          enabled: True
          text_dim: 384
          proj_dim: 192
          proj_hidden: 256
          proj_layers: 2
          fusion: "multiply"

model_init:
  tse_model: null
  discriminator: null
  spk_model: null

num_avg: 10
num_epochs: 40

optimizer:
  tse_model: Adam
optimizer_args:
  tse_model:
    lr: 0.001
    weight_decay: 0.0001

clip_grad: 5.0
save_epoch_interval: 2

scheduler:
  tse_model: ExponentialDecrease
scheduler_args:
  tse_model:
    final_lr: 2.5e-05
    initial_lr: 0.001
    warm_from_zero: false
    warm_up_epoch: 0

seed: 42
