# Exp1: text-TSE with a TIME-RESOLVED text cue.
#   cue = MiniLM per-token sequence (L, 384)  [NOT mean-pooled]
#   fusion = cross-attention (audio frame queries x text tokens) + multiply
# Goal: let the separator align each word to the audio instead of memorizing a
# single sentence-vector fingerprint. Only the textemb block differs from
# tse_bsrnn_text.yaml (the sentence-vector baseline).
#
# Requires a TOKEN embeddings npz (extract_text_embeddings.py --pooling token,
# written to emb/minilm_token/embeddings.npz) and a cues.yaml whose text.policy
# .embeddings points at that token npz.
dataloader_args:
  batch_size: 4
  drop_last: true
  num_workers: 6
  pin_memory: true
  prefetch_factor: 6

dataset_args:
  resample_rate: &sr 16000
  sample_num_per_epoch: 0
  shuffle: true
  shuffle_args:
    shuffle_size: 2500
  chunk_len: 24000
  noise_prob: 0
  noise_lmdb_file: './data/musan/lmdb'
  cues:
    audio:
      use: false
      required: false
    text:
      use: true
      required: true
  cue_processing: { }

enable_amp: false
exp_dir: exp/BSRNN_TEXT_XATTN
gpus: '0,1'
log_batch_interval: 100

loss: SISDR
loss_args: { }

model:
  tse_model: TSE_BSRNN_SPK
model_args:
  tse_model:
    separator:
      sr: *sr
      win: 512
      stride: 128
      feature_dim: 128
      num_repeat: 6
      causal: False
      nspk: 1
    speaker:
      features:
        listen:
          enabled: False
        usef:
          enabled: False
        tfmap:
          enabled: False
        context:
          enabled: False
        spkemb:
          enabled: False
        textemb:
          enabled: True
          mode: cross_attn    # time-resolved: cross-attn over token sequence
          text_dim: 384       # MiniLM-L6-v2 hidden size
          atten_dim: 128      # cross-attn dim (= mix feature_dim -> Identity query proj)
          num_heads: 4
          fusion: "multiply"  # post-attn SpeakerFuseLayer (NOT FiLM here)
          mix_dim: 128        # = separator feature_dim
          # band: set to sep_model.nband at model init

model_init:
  tse_model: null
  discriminator: null
  spk_model: null

num_avg: 10
num_epochs: 150

optimizer:
  tse_model: Adam
optimizer_args:
  tse_model:
    lr: 0.001
    weight_decay: 0.0001

clip_grad: 5.0
save_epoch_interval: 10

scheduler:
  tse_model: ExponentialDecrease
scheduler_args:
  tse_model:
    final_lr: 2.5e-05
    initial_lr: 0.001
    warm_from_zero: false
    warm_up_epoch: 0

seed: 42
